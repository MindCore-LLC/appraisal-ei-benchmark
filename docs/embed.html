<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<title>Appraisal-EI Benchmark</title>
<link rel="stylesheet" href="assets/tokens.css">
<script>
  // Theme: ?theme=dark|light wins, else saved preference. Applied pre-paint.
  (function () {
    const q = new URLSearchParams(location.search).get("theme");
    const t = q || localStorage.getItem("ae-theme");
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
<style>
  @font-face { font-family: "Commissioner"; src: url("assets/fonts/Commissioner-Body-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Commissioner"; src: url("assets/fonts/Commissioner-Body-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Commissioner Fallback"; src: local("Helvetica Neue"), local("Helvetica"), local("Arial");
               size-adjust: 96%; ascent-override: 96%; descent-override: 26%; line-gap-override: 0%; }
  :root {
    --font-sans: "Commissioner", "Commissioner Fallback", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --ink: var(--color-text-primary); --paper: var(--color-canvas); --line: var(--color-border-default);
    --muted: var(--color-text-muted); --smoke: var(--color-warning);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 14px/1.5 var(--font-sans); }
  .head { display: flex; align-items: baseline; justify-content: space-between;
          padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .head .t { font-weight: 500; font-size: 13px; }
  .head a { color: var(--muted); text-decoration: none; font-size: 11px; }
  .head a:hover { color: var(--ink); }
  .row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline;
         padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .rank { font: 500 12px var(--font-mono); color: var(--muted); }
  .name { font-weight: 500; font-size: 14px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .score { font: 500 17px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
  .score small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; text-align: right; }
  .bar { grid-column: 2 / 4; height: 3px; background: var(--line); margin-top: -4px; }
  .bar i { display: block; height: 100%; }
  .foot { display: flex; justify-content: space-between; padding: 8px 16px; font-size: 10.5px;
          color: var(--muted); border-top: 1px solid var(--line); }
  .badge { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 5px;
           border: 1px solid var(--smoke); color: var(--smoke); background: var(--color-warning-tint); }
</style>
</head>
<body>
<div class="head">
  <span class="t">Appraisal-EI Benchmark <span id="ver" style="color:var(--muted);font-weight:400"></span></span>
  <a href="index.html" target="_top">full board &#8599;</a>
</div>
<div id="rows"></div>
<div class="foot"><span id="note"></span><span class="badge" id="badge">smoke</span></div>

<script>
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PALETTE = [1, 2, 3, 4, 5, 6].map(i => cssVar(`--color-series-${i}`) || "#141414");

(async () => {
  const d = await fetch("data.json").then(r => r.json());
  document.getElementById("ver").textContent = "v" + d.benchmark_version;
  const n = +(new URLSearchParams(location.search).get("n") || 3);
  const rows = [...d.results].sort((a, b) => b.appraisal_calibration - a.appraisal_calibration).slice(0, n);
  document.getElementById("rows").innerHTML = rows.map((r, i) => `
    <div class="row">
      <span class="rank">${String(i + 1).padStart(2, "0")}</span>
      <div>
        <div class="name">${r.model}</div>
        <div class="meta">${(r.meta && r.meta.org) || ""} · ${(r.meta && r.meta.origin) || ""} · ${r.n_parsed}/${r.n_items} items</div>
      </div>
      <div class="score">${(r.appraisal_calibration * 100).toFixed(1)}%<small>alignment</small></div>
      <div class="bar"><i style="width:${r.appraisal_calibration * 100}%;background:${PALETTE[i % PALETTE.length]}"></i></div>
    </div>`).join("");
  const smoke = rows.some(r => r.status === "smoke");
  document.getElementById("badge").textContent = smoke ? "pre-gold" : "measured";
  document.getElementById("note").textContent = smoke
    ? "scored vs generator priors - provisional" : "scored vs human gold";
})();
</script>
</body>
</html>
