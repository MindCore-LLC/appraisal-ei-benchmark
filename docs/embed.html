<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appraisal-EI Benchmark</title>
<link rel="stylesheet" href="assets/tokens.css">
<script>
  // Theme: ?theme=dark|light wins, else saved preference. Applied pre-paint.
  (function () {
    const q = new URLSearchParams(location.search).get("theme");
    const t = q || localStorage.getItem("ae-theme");
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
<style>
  @font-face { font-family: "Commissioner"; src: url("assets/fonts/Commissioner-Body-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Commissioner"; src: url("assets/fonts/Commissioner-Body-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Commissioner Fallback"; src: local("Helvetica Neue"), local("Helvetica"), local("Arial");
               size-adjust: 96%; ascent-override: 96%; descent-override: 26%; line-gap-override: 0%; }
  :root {
    --font-sans: "Commissioner", "Commissioner Fallback", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --ink: var(--color-text-primary); --paper: var(--color-canvas); --line: var(--color-border-default);
    --muted: var(--color-text-muted); --sig: var(--color-signature);
    --data: var(--color-data);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 14px/1.5 var(--font-sans); }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 16px 8px; }
  .head .t { font-weight: 500; font-size: 13px; }
  .head .t .k { font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .1em;
                color: var(--muted); display: block; margin-bottom: 2px; }
  .head a { color: var(--muted); text-decoration: none; font-size: 11px; }
  .head a:hover { color: var(--ink); text-decoration: underline; }
  /* the baseline row: brand-marked, reads as the reference, not a competitor */
  .row.base { background: var(--color-signature-tint); border-left: none; }
  .row.base .rank { color: var(--sig); }
  .row.base .name { color: var(--sig); }
  .row.base .score { color: var(--sig); }
  .row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline;
         padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .rank { font: 500 11px var(--font-mono); color: var(--muted); }
  .name { font-weight: 500; font-size: 13.5px; }
  .meta { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .score { font: 500 16px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
  .score small { display: block; font-size: 9.5px; color: var(--muted); font-weight: 400; text-align: right; }
  .bar { grid-column: 2 / 4; height: 3px; background: var(--color-sunken); margin-top: -4px; }
  .bar i { display: block; height: 100%; }
  /* baseline bar: full-width tick so model bars read as a fraction of human */
  .bar.base-bar { background: transparent; border-bottom: 1px dashed var(--sig); height: 0; margin-top: -2px; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding: 7px 16px; font-size: 10.5px;
          color: var(--muted); border-top: 1px solid var(--line); }
  .badge { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 5px;
           border: 1px solid var(--color-success); color: var(--color-success); background: var(--color-success-tint); }
</style>
</head>
<body>
<div class="head">
  <span class="t"><span class="k">Affective Research</span>Appraisal-EI Benchmark <span id="ver" style="color:var(--muted);font-weight:400"></span></span>
  <a href="index.html" target="_top">full board &#8599;</a>
</div>
<div id="rows"></div>
<div class="foot"><span id="note"></span><span class="badge" id="badge">measured</span></div>

<script>
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

(async () => {
  const d = await fetch("data.json").then(r => r.json());
  document.getElementById("ver").textContent = "v" + d.benchmark_version;
  const n = +(new URLSearchParams(location.search).get("n") || 3);
  const human = d.results.find(r => r.model_id === "human");
  const ceiling = human?.appraisal_tracking ?? 1;
  const models = [...d.results]
    .filter(r => r.status === "measured" && r.model_id !== "human" && r.appraisal_tracking != null)
    .sort((a, b) => b.appraisal_tracking - a.appraisal_tracking).slice(0, n);
  // Bars scale against the human baseline, so the reader sees "fraction of
  // human" at a glance instead of a bar length with no referent.
  const html = [];
  if (human) {
    html.push(`<div class="row base">
      <span class="rank">–</span>
      <div>
        <div class="name">${human.model}</div>
        <div class="meta">baseline · leave-one-rater-out · ${human.n_parsed}/${human.n_items} items</div>
      </div>
      <div class="score">${human.appraisal_tracking.toFixed(3)}<small>human baseline r</small></div>
      <div class="bar base-bar"></div>
    </div>`);
  }
  html.push(models.map((r, i) => {
    const disc = r.subscores?.discriminant_validity;
    return `<div class="row">
      <span class="rank">${String(i + 1).padStart(2, "0")}</span>
      <div>
        <div class="name">${r.model}</div>
        <div class="meta">${(r.meta && r.meta.org) || ""} · ${(r.meta && r.meta.origin) || ""} · ${r.n_parsed}/${r.n_items} items</div>
      </div>
      <div class="score">${r.appraisal_tracking.toFixed(3)}<small>r · disc ${disc == null ? "–" : disc.toFixed(2)}</small></div>
      <div class="bar"><i style="width:${Math.min(100, r.appraisal_tracking / ceiling * 100).toFixed(1)}%;background:var(--data)"></i></div>
    </div>`;
  }).join(""));
  document.getElementById("rows").innerHTML = html.join("");
  document.getElementById("note").textContent =
    "tracking vs human gold · a no-model answer scores 0 · bars scaled to the human baseline · v" + d.benchmark_version;
})();
</script>
</body>
</html>
